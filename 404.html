<!DOCTYPE html>
<html lang="en" data-wing="lab" data-accent="cyan">
<head>
  <meta charset="utf-8">
  <!-- Privacy lock. Only this site's own files may load, plus GoatCounter.
       Same line on every page - tests/unit/pages.test.js checks it. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://gc.zgo.at; connect-src 'self' https://jonjoe1001.goatcounter.com; img-src 'self' data: blob: https://jonjoe1001.goatcounter.com; style-src 'self'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">

  <!-- GitHub Pages serves this page for a missing file at ANY depth,
       so every path here is absolute (/limitless-lab/...). -->
  <title>Page not found - Limitless Lab</title>
  <meta name="theme-color" content="#07070C">

  <link rel="icon" href="/limitless-lab/kit/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/limitless-lab/kit/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/limitless-lab/kit/kit.css">
  <link rel="stylesheet" href="/limitless-lab/404.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ===================== HEADER ===================== -->
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="/limitless-lab/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Limitless Lab</span>
      </a>
      <nav class="nav-links" aria-label="Site">
        <a class="btn btn-sm" href="https://jonjoe1001.dev/"><span aria-hidden="true">&larr;</span> Home</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="wrap">
        <p class="kicker">404</p>
        <h1>That page wandered off</h1>
        <p class="hero-lead">It may have moved, or the link has a typo.</p>
        <div class="lost-actions">
          <a class="btn btn-primary" href="/limitless-lab/">Back to the Lab</a>
          <a class="btn" href="https://jonjoe1001.dev/limitless.html">All of Limitless Lab</a>
          <a class="btn" href="https://jonjoe1001.dev/">Home</a>
        </div>
      </div>
    </section>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p class="privacy-note">
        <strong>No accounts, no cookies.</strong> Saves stay on your device.
        Cookie-free visit counts via GoatCounter.
        <a href="https://jonjoe1001.dev/privacy.html#limitless">Privacy</a>
      </p>
    </div>
  </footer>

  <script src="/limitless-lab/kit/stats.js" defer></script>
</body>
</html>
